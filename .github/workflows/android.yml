name: Petak Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach APKs to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Web build (minified, code-split)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug and release APKs
        working-directory: android
        env:
          PETAK_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          PETAK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PETAK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PETAK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Petak-v$V-debug.apk"
          for f in android/app/build/outputs/apk/release/*.apk; do
            case "$f" in *unsigned*) cp "$f" "out/Petak-v$V-unsigned.apk" ;; *) cp "$f" "out/Petak-v$V.apk" ;; esac
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Petak-apks
          path: out/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
