name: Petak Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach APKs to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK; only add the platform and build tools we compile against.
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Web build (minified, code-split)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug and release APKs
        working-directory: android
        env:
          PETAK_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          PETAK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PETAK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PETAK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          # universal APKs keep the plain names; per-ABI APKs get the ABI in the name
          cp android/app/build/outputs/apk/release/app-universal-release.apk "out/Petak-v$V.apk"
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk "out/Petak-v$V-debug.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "out/Petak-v$V-$abi.apk"
          done
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release key configured (KEYSTORE_BASE64 secret): release APKs are signed with this runner's debug key."
          fi
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - name: Size report
        run: |
          node scripts/size-report.mjs --summary
          cp SIZE.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: Petak-apks
          path: |
            out/*.apk
            out/SHA256SUMS.txt
            out/SIZE.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
            out/SIZE.md
          generate_release_notes: true
